name: Build Strata Engine (Windows x64 + CUDA 12.0 + V100 sm_70)

on:
  workflow_dispatch:
    inputs:
      strata_ref:
        description: 'Niko1221/Strata 分支或标签（默认 main）'
        required: false
        default: 'main'
        type: string

jobs:
  build-strata-win-v100-cuda120:
    runs-on: windows-2022

    steps:
      - name: Checkout Niko1221/Strata
        uses: actions/checkout@v4
        with:
          repository: Niko1221/Strata
          ref: ${{ inputs.strata_ref }}
          path: Strata
          fetch-depth: 1
          submodules: recursive

      - name: Install CUDA Toolkit 12.0.1 (NVIDIA Official Redist)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cudaDir = "C:\cuda-12.0"
          $tmpDir  = "C:\cuda-tmp"
          New-Item -ItemType Directory -Force -Path $cudaDir, $tmpDir | Out-Null

          $urls = @(
            "https://developer.download.nvidia.com/compute/cuda/redist/cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-12.0.146-archive.zip",
            "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-12.0.140-archive.zip",
            "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvrtc/windows-x86_64/cuda_nvrtc-windows-x86_64-12.0.140-archive.zip",
            "https://developer.download.nvidia.com/compute/cuda/redist/libcublas/windows-x86_64/libcublas-windows-x86_64-12.0.2.224-archive.zip",
            "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvtx/windows-x86_64/cuda_nvtx-windows-x86_64-12.0.140-archive.zip",
            "https://developer.download.nvidia.com/compute/cuda/redist/cuda_profiler_api/windows-x86_64/cuda_profiler_api-windows-x86_64-12.0.140-archive.zip",
            "https://developer.download.nvidia.com/compute/cuda/redist/cuda_cccl/windows-x86_64/cuda_cccl-windows-x86_64-12.0.140-archive.zip",
            "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvml_dev/windows-x86_64/cuda_nvml_dev-windows-x86_64-12.0.140-archive.zip"
          )

          foreach ($url in $urls) {
            $file = Join-Path $tmpDir (Split-Path $url -Leaf)
            Write-Host "Downloading $url ..."
            curl.exe -fsSL -o $file $url
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $url" }
            7z x -y "-o$tmpDir" $file | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Extract failed: $file" }
          }

          Get-ChildItem -Path $tmpDir -Directory -Filter "*-archive" | ForEach-Object {
            Copy-Item -Path (Join-Path $_.FullName "*") -Destination $cudaDir -Recurse -Force
          }

          Remove-Item -Path $tmpDir -Recurse -Force

          "$cudaDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CUDA_PATH=$cudaDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDA_PATH_V12_0=$cudaDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDAToolkit_ROOT=$cudaDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify NVCC & Install Ninja
        shell: pwsh
        run: |
          nvcc --version
          choco install ninja -y

      - name: Configure and Build Strata (CUDA 12.0 + sm_70)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1

          cmake -G Ninja -S Strata/engine -B build ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DSTRATA_ENABLE_CUDA=ON ^
            -DSTRATA_BUILD_TESTS=OFF ^
            -DSTRATA_NATIVE_EXPERTS=ON ^
            -DSTRATA_PORTABLE=ON ^
            -DSTRATA_EXPERIMENTAL_SM60=ON ^
            -DCMAKE_CUDA_ARCHITECTURES="70-real;70-virtual" ^
            -DCMAKE_CUDA_COMPILER="C:/cuda-12.0/bin/nvcc.exe" ^
            -DCUDAToolkit_ROOT="C:/cuda-12.0" ^
            -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
          if errorlevel 1 exit /b 1

          set TARGETS=strata
          cmake --build build --target help | findstr /C:"strata_kq" >nul && set TARGETS=strata strata_kq
          echo Building targets: %TARGETS%

          cmake --build build -j 3 --target %TARGETS%
          if errorlevel 1 exit /b 1

      - name: Package Strata Binaries and CUDA 12.0 Runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          # Copy built strata binaries & DLLs (check both build root and bin/Release)
          $searchDirs = @("build", "build\bin", "build\bin\Release") | Where-Object { Test-Path $_ }
          foreach ($d in $searchDirs) {
            Get-ChildItem -Path $d -Filter "*.exe" -File | Copy-Item -Destination $dist -Force
            Get-ChildItem -Path $d -Filter "*.dll" -File | Copy-Item -Destination $dist -Force
          }

          # Bundle CUDA 12.0 runtime DLLs so it works out-of-the-box on Windows Server 2016
          $cudaDlls = @("cudart64_12.dll", "cublas64_12.dll", "cublasLt64_12.dll")
          foreach ($dll in $cudaDlls) {
            $found = Get-ChildItem -Path $env:CUDA_PATH -Recurse -Filter $dll | Select-Object -First 1
            if (-not $found) { throw "Required CUDA DLL not found: $dll" }
            Copy-Item -Path $found.FullName -Destination $dist -Force
          }

          foreach ($req in @("strata.exe", "cudart64_12.dll", "cublas64_12.dll", "cublasLt64_12.dll")) {
            if (-not (Test-Path (Join-Path $dist $req))) {
              throw "Missing expected output file: $req"
            }
          }

          Get-ChildItem $dist | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize
          7z a -tzip strata-win-x64-cuda12.0-v100-sm70.zip "$dist\*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: strata-win-x64-cuda12.0-v100-sm70
          path: strata-win-x64-cuda12.0-v100-sm70.zip
          retention-days: 30
